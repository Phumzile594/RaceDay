name: RaceDay CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          echo "Checking RaceDay Part 1 files..."
          test -f "README.md"
          test -f "docs/RaceDay Part 1/RaceDay_ERD.png"
          test -f "docs/RaceDay Part 1/RaceDay_Database.sql"
          test -f "docs/RaceDay Part 1/Raceday API Endpoint Plan.pdf"
          echo "All required RaceDay Part 1 files are present."
